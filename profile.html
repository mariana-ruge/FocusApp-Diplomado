<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Perfiles - FocusFlow Work</title>
      <meta name="description" content="Gestiona tus perfiles de usuario en FocusFlow Work.">
      <!-- bootstrap css -->
      <link rel="stylesheet" href="css/bootstrap.min.css">
      <link rel="stylesheet" href="css/style.css">
      <link rel="stylesheet" href="css/app/focusflow.css">
      <link rel="stylesheet" href="css/responsive.css">
      <link rel="icon" href="images/fevicon.png" type="image/gif">
      <link rel="stylesheet" href="css/jquery.mCustomScrollbar.min.css">
      <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">

      <style>
        /* --- Tarjetas de perfil --- */
        .ff-profiles-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 20px;
          margin-bottom: 36px;
        }

        .ff-profile-card {
          background: var(--ff-white);
          border-radius: var(--ff-radius-lg);
          padding: 28px 24px;
          text-align: center;
          box-shadow: var(--ff-shadow);
          transition: var(--ff-transition);
          position: relative;
          border: 3px solid transparent;
        }

        .ff-profile-card:hover {
          transform: translateY(-2px);
          box-shadow: var(--ff-shadow-lg);
        }

        .ff-profile-card.active {
          border-color: var(--ff-primary);
        }

        .ff-profile-card .ff-badge-active {
          position: absolute;
          top: 12px;
          right: 12px;
          background: var(--ff-primary);
          color: var(--ff-white);
          font-size: 11px;
          font-weight: 700;
          padding: 3px 10px;
          border-radius: 20px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        .ff-profile-avatar {
          font-size: 48px;
          margin-bottom: 12px;
          line-height: 1;
          color: var(--ff-primary);
        }

        .ff-profile-name {
          font-family: var(--ff-font-heading);
          font-size: 22px;
          color: var(--ff-text);
          margin-bottom: 4px;
          padding: 0;
        }

        .ff-profile-date {
          font-size: 13px;
          color: var(--ff-text-light);
          margin-bottom: 16px;
        }

        .ff-profile-stats {
          display: flex;
          justify-content: center;
          gap: 20px;
          margin-bottom: 18px;
          font-size: 13px;
          color: var(--ff-text-light);
        }

        .ff-profile-stats strong {
          display: block;
          font-size: 20px;
          font-family: 'Rajdhani', sans-serif;
          font-weight: 700;
          color: var(--ff-text);
        }

        .ff-profile-actions {
          display: flex;
          gap: 8px;
          justify-content: center;
          flex-wrap: wrap;
        }

        /* --- Tarjeta de añadir --- */
        .ff-profile-card-add {
          background: var(--ff-bg);
          border: 2px dashed #ccc;
          border-radius: var(--ff-radius-lg);
          padding: 28px 24px;
          text-align: center;
          cursor: pointer;
          transition: var(--ff-transition);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 250px;
        }

        .ff-profile-card-add:hover {
          border-color: var(--ff-primary);
          background: var(--ff-white);
        }

        .ff-profile-card-add .ff-add-icon {
          font-size: 48px;
          color: #ccc;
          margin-bottom: 10px;
          transition: var(--ff-transition);
        }

        .ff-profile-card-add:hover .ff-add-icon {
          color: var(--ff-primary);
        }

        .ff-profile-card-add span {
          font-size: 16px;
          color: var(--ff-text-light);
        }

        /* --- Formulario de nuevo perfil --- */
        .ff-new-profile-form {
          background: var(--ff-white);
          border-radius: var(--ff-radius-lg);
          padding: 32px;
          box-shadow: var(--ff-shadow-lg);
          margin-bottom: 36px;
          max-width: 500px;
          margin-left: auto;
          margin-right: auto;
        }

        .ff-new-profile-form h3 {
          font-family: var(--ff-font-heading);
          font-size: 22px;
          text-align: center;
          margin-bottom: 20px;
          padding: 0;
        }

        .ff-form-group {
          margin-bottom: 18px;
        }

        .ff-form-group label {
          display: block;
          font-size: 14px;
          font-weight: 600;
          color: var(--ff-text);
          margin-bottom: 6px;
        }

        .ff-form-group input[type="text"] {
          width: 100%;
          padding: 10px 14px;
          border: 2px solid #ddd;
          border-radius: var(--ff-radius);
          font-size: 16px;
          font-family: var(--ff-font-body);
          transition: var(--ff-transition);
        }

        .ff-form-group input[type="text"]:focus {
          border-color: var(--ff-primary);
          outline: none;
          box-shadow: 0 0 0 3px rgba(8, 145, 248, 0.15);
        }

        /* --- Selector de avatar --- */
        .ff-avatar-picker {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          justify-content: center;
        }

        .ff-avatar-option {
          font-size: 22px;
          width: 52px;
          height: 52px;
          border: 2px solid #ddd;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: var(--ff-transition);
          background: var(--ff-white);
          padding: 0;
          color: var(--ff-text-light);
        }

        .ff-avatar-option:hover {
          border-color: var(--ff-primary);
          transform: scale(1.1);
        }

        .ff-avatar-option.selected {
          border-color: var(--ff-primary);
          background: rgba(8, 145, 248, 0.08);
          box-shadow: 0 0 0 3px rgba(8, 145, 248, 0.2);
          color: var(--ff-primary);
        }

        .ff-avatar-option:focus-visible {
          outline: 3px solid var(--ff-primary);
          outline-offset: 2px;
        }

        .ff-form-actions {
          display: flex;
          gap: 12px;
          justify-content: center;
          margin-top: 24px;
        }

        @media (max-width: 576px) {
          .ff-profiles-grid {
            grid-template-columns: 1fr;
          }
          .ff-new-profile-form { padding: 24px 16px; }
        }
      </style>
   </head>
   <body class="main-layout">

      </div>

      <nav class="ff-navbar" role="navigation" aria-label="Navegación principal">

               <li><a class="ff-nav-link" href="index.html">Inicio</a></li>

               <li><a class="ff-nav-link ff-active" href="profile.html" aria-current="page">Perfil</a></li>

            </ul>
            <button class="ff-hamburger" id="ff-hamburger" aria-label="Abrir menú" aria-expanded="false" aria-controls="ff-nav-menu">
               <span class="ff-hamburger-line"></span>
               <span class="ff-hamburger-line"></span>
               <span class="ff-hamburger-line"></span>
            </button>
         </div>
         <div class="ff-navbar-wave" aria-hidden="true">
            <svg viewBox="0 0 1440 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
               <path d="M0,0 C360,20 1080,20 1440,0 L1440,0 L0,0 Z" fill="rgba(6,112,196,0.92)"/>

         </div>
      </nav>
      <div class="ff-nav-overlay" id="ff-nav-overlay"></div>

      <!-- Contenido principal -->
      <main class="ff-main" id="main-content">
         <div class="container">

            <div class="ff-page-title">
               <h2>Perfiles</h2>
               <p>Cada perfil conserva sus propias estadísticas y preferencias.</p>
            </div>

            <!-- Formulario de nuevo perfil (oculto por defecto) -->
            <div class="ff-new-profile-form" id="ff-new-form" style="display: none;">
               <h3 id="ff-form-title">Nuevo perfil</h3>
               <input type="hidden" id="ff-edit-user-id" value="">
               <div class="ff-form-group">
                  <label for="ff-input-name">Nombre</label>
                  <input type="text" id="ff-input-name" maxlength="30" placeholder="¿Cómo te llamas?" autocomplete="off">
               </div>
               <div class="ff-form-group">
                  <label>Avatar</label>
                  <div class="ff-avatar-picker" id="ff-avatar-picker" role="radiogroup" aria-label="Selecciona un avatar">
                     <!-- Se generan con JS -->
                  </div>
               </div>
               <div class="ff-form-actions">
                  <button class="ff-btn ff-btn-primary" id="ff-btn-save-profile">
                     <i class="fa fa-check" aria-hidden="true"></i> Guardar
                  </button>
                  <button class="ff-btn ff-btn-secondary" id="ff-btn-cancel-form">Cancelar</button>
               </div>
            </div>

            <!-- Grid de perfiles -->
            <div class="ff-profiles-grid" id="ff-profiles-grid" role="list" aria-label="Lista de perfiles">
               <!-- Se genera con JS -->
            </div>

         </div>
      </main>

      <footer>

                  <div class="col-md-12">
                     <div class="cont">

                     </div>
                  </div>

               </div>
            </div>
            <div class="copyright">
               <div class="container">
                  <div class="row">
                     <div class="col-md-12">
                        <p class="ff-disclaimer">FocusFlow Work es una herramienta de apoyo a la productividad. No sustituye acompañamiento profesional.</p>
                        <p>© 2026 FocusFlow Work</p>
                     </div>

            </div>

      <!-- Javascript: plantilla base -->
      <script src="js/jquery.min.js"></script>
      <script src="js/popper.min.js"></script>
      <script src="js/bootstrap.bundle.min.js"></script>
      <script src="js/jquery-3.0.0.min.js"></script>
      <script src="js/plugin.js"></script>
      <script src="js/jquery.mCustomScrollbar.concat.min.js"></script>
      <script src="js/custom.js"></script>

      <!-- Javascript: FocusFlow -->
      <script src="js/app/storage.js"></script>
      <script src="js/app/notifications.js"></script>
      <script src="js/app/focus-mode.js"></script>
      <script src="js/app/user-service.js"></script>
      <script src="js/app/main.js"></script>

      <script>
      (function () {
        'use strict';

        var grid       = document.getElementById('ff-profiles-grid');
        var form       = document.getElementById('ff-new-form');
        var formTitle  = document.getElementById('ff-form-title');
        var inputName  = document.getElementById('ff-input-name');
        var editId     = document.getElementById('ff-edit-user-id');
        var picker     = document.getElementById('ff-avatar-picker');
        var btnSave    = document.getElementById('ff-btn-save-profile');
        var btnCancel  = document.getElementById('ff-btn-cancel-form');

        var selectedAvatar = UserService.AVATAR_OPTIONS[0];

        // =====================================================================
        // Renderizar picker de avatares
        // =====================================================================
        function renderAvatarPicker() {
          var avatars = UserService.getAvatarOptions();
          picker.innerHTML = '';
          avatars.forEach(function (iconClass) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'ff-avatar-option' + (iconClass === selectedAvatar ? ' selected' : '');
            btn.setAttribute('role', 'radio');
            btn.setAttribute('aria-checked', iconClass === selectedAvatar ? 'true' : 'false');
            btn.setAttribute('aria-label', 'Avatar ' + iconClass);
            btn.innerHTML = '<i class="fa ' + iconClass + '" aria-hidden="true"></i>';
            btn.addEventListener('click', function () {
              selectedAvatar = iconClass;
              var all = picker.querySelectorAll('.ff-avatar-option');
              for (var i = 0; i < all.length; i++) {
                all[i].classList.remove('selected');
                all[i].setAttribute('aria-checked', 'false');
              }
              btn.classList.add('selected');
              btn.setAttribute('aria-checked', 'true');
            });
            picker.appendChild(btn);
          });
        }

        // =====================================================================
        // Renderizar grid de perfiles
        // =====================================================================
        function renderProfiles() {
          var users = UserService.getAll();
          var activeId = UserService.getActiveUserId();
          grid.innerHTML = '';

          users.forEach(function (user) {
            var isActive = user.id === activeId;
            var sessions = StorageService.getForUser(user.id, 'sessions') || [];
            var completed = sessions.filter(function (s) { return s.completed; }).length;

            var card = document.createElement('div');
            card.className = 'ff-profile-card' + (isActive ? ' active' : '');
            card.setAttribute('role', 'listitem');

            var html = '';
            if (isActive) {
              html += '<span class="ff-badge-active">Activo</span>';
            }
            html += '<div class="ff-profile-avatar"><i class="fa ' + _escapeAttr(user.avatar) + '" aria-hidden="true"></i></div>';
            html += '<h3 class="ff-profile-name">' + _escapeHtml(user.name) + '</h3>';
            html += '<div class="ff-profile-date">Creado el ' + _formatDate(user.createdAt) + '</div>';
            html += '<div class="ff-profile-stats">';
            html += '  <div><strong>' + sessions.length + '</strong>Sesiones</div>';
            html += '  <div><strong>' + completed + '</strong>Completadas</div>';
            html += '</div>';
            html += '<div class="ff-profile-actions">';

            if (!isActive) {
              html += '<button class="ff-btn ff-btn-primary ff-btn-small ff-btn-activate" data-id="' + _escapeAttr(user.id) + '">';
              html += '<i class="fa fa-user" aria-hidden="true"></i> Activar</button>';
            }

            html += '<button class="ff-btn ff-btn-outline ff-btn-small ff-btn-edit" data-id="' + _escapeAttr(user.id) + '">';
            html += '<i class="fa fa-pencil" aria-hidden="true"></i> Editar</button>';

            if (users.length > 1) {
              html += '<button class="ff-btn ff-btn-outline ff-btn-small ff-btn-delete" data-id="' + _escapeAttr(user.id) + '" style="color:var(--ff-red);border-color:var(--ff-red);">';
              html += '<i class="fa fa-trash-o" aria-hidden="true"></i></button>';
            }

            html += '</div>';
            card.innerHTML = html;
            grid.appendChild(card);
          });

          // Tarjeta de añadir nuevo
          var addCard = document.createElement('div');
          addCard.className = 'ff-profile-card-add';
          addCard.setAttribute('role', 'listitem');
          addCard.setAttribute('tabindex', '0');
          addCard.setAttribute('aria-label', 'Crear nuevo perfil');
          addCard.innerHTML =
            '<div class="ff-add-icon"><i class="fa fa-plus-circle"></i></div>' +
            '<span>Nuevo perfil</span>';
          addCard.addEventListener('click', function () { showForm(); });
          addCard.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showForm(); }
          });
          grid.appendChild(addCard);

          // Listeners de botones
          _bindCardButtons();
        }

        // =====================================================================
        // Vincular listeners a botones dentro de las tarjetas
        // =====================================================================
        function _bindCardButtons() {
          // Activar
          var activateBtns = grid.querySelectorAll('.ff-btn-activate');
          for (var i = 0; i < activateBtns.length; i++) {
            activateBtns[i].addEventListener('click', function () {
              UserService.setActive(this.getAttribute('data-id'));
              renderProfiles();
              NotificationService.showInPage('Perfil cambiado', 'Has cambiado al perfil seleccionado.');
            });
          }

          // Editar
          var editBtns = grid.querySelectorAll('.ff-btn-edit');
          for (var j = 0; j < editBtns.length; j++) {
            editBtns[j].addEventListener('click', function () {
              var user = UserService.getById(this.getAttribute('data-id'));
              if (user) showForm(user);
            });
          }

          // Eliminar
          var deleteBtns = grid.querySelectorAll('.ff-btn-delete');
          for (var k = 0; k < deleteBtns.length; k++) {
            deleteBtns[k].addEventListener('click', function () {
              var userId = this.getAttribute('data-id');
              var user = UserService.getById(userId);
              if (!user) return;
              if (confirm('¿Eliminar el perfil "' + user.name + '"? Sus estadísticas se perderán.')) {
                UserService.remove(userId);
                renderProfiles();
                NotificationService.showInPage('Perfil eliminado', 'El perfil ha sido eliminado.');
              }
            });
          }
        }

        // =====================================================================
        // Mostrar formulario (nuevo o edición)
        // =====================================================================
        function showForm(user) {
          form.style.display = 'block';

          if (user) {
            formTitle.textContent = 'Editar perfil';
            editId.value = user.id;
            inputName.value = user.name;
            selectedAvatar = user.avatar;
          } else {
            formTitle.textContent = 'Nuevo perfil';
            editId.value = '';
            inputName.value = '';
            selectedAvatar = UserService.AVATAR_OPTIONS[0];
          }

          renderAvatarPicker();
          form.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(function () { inputName.focus(); }, 300);
        }

        function hideForm() {
          form.style.display = 'none';
          editId.value = '';
          inputName.value = '';
        }

        // =====================================================================
        // Guardar perfil (nuevo o editado)
        // =====================================================================
        btnSave.addEventListener('click', function () {
          var name = inputName.value.trim();
          if (!name) {
            inputName.focus();
            return;
          }

          var uid = editId.value;
          if (uid) {
            // Edición
            UserService.update(uid, { name: name, avatar: selectedAvatar });
            NotificationService.showInPage('Perfil actualizado', 'Los cambios se guardaron correctamente.');
          } else {
            // Nuevo
            var newUser = UserService.create({ name: name, avatar: selectedAvatar });
            UserService.setActive(newUser.id);
            NotificationService.showInPage('Perfil creado', '¡Bienvenido, ' + name + '!');
          }

          hideForm();
          renderProfiles();
        });

        // Enter en campo nombre = guardar
        inputName.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); btnSave.click(); }
        });

        btnCancel.addEventListener('click', function () { hideForm(); });

        // =====================================================================
        // Utilidades
        // =====================================================================
        function _escapeHtml(text) {
          var div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }

        function _escapeAttr(text) {
          return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        }

        function _formatDate(isoStr) {
          if (!isoStr) return '—';
          var d = new Date(isoStr);
          var months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
          return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
        }

        // =====================================================================
        // Inicializar
        // =====================================================================
        renderProfiles();

      })();
      </script>
   </body>
</html>
